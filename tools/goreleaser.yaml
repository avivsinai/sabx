version: 2

before:
  hooks:
    - go mod tidy

project_name: sabx

builds:
  - id: sabx
    main: ./cmd/sabx
    binary: sabx
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/avivsinai/sabx/internal/buildinfo.Version={{ .Version }}
      - -X github.com/avivsinai/sabx/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/avivsinai/sabx/internal/buildinfo.Date={{ .Date }}
    flags:
      - -trimpath
    hooks:
      post:
        - sh -ceu 'if [ "$2" = darwin ] && [ "$(uname -s)" = Darwin ]; then codesign --force --sign - --identifier io.github.avivsinai.sabx "$1"; fi' _ "{{ .Path }}" "{{ .Os }}"

# Release builds sign the darwin binaries with our Developer ID and notarize
# them (quill, so this runs on the Linux release runner). release.yml sets
# SABX_MACOS_SIGN=true only when all APPLE_* signing secrets are present.
#
# Keychain matches each caller by a partition ID. Ad-hoc code gets
# `cdhash:<hash>`, which changes on every build, so each upgrade prompts again.
# Developer ID code gets `teamid:<TEAM_ID>`, which is stable, so one "Always
# Allow" survives upgrades. quill sets the signing identifier to the binary
# name, `sabx`; keep the binary name and the team, or every user approves again.
notarize:
  macos:
    - enabled: '{{ eq (envOrDefault "SABX_MACOS_SIGN" "") "true" }}'
      ids: [sabx]
      sign:
        # quill reads and base64-decodes these variables itself, so the
        # secret bytes never pass through the template engine.
        certificate: "env:APPLE_DEVELOPER_ID_P12_BASE64"
        password: "{{ .Env.APPLE_DEVELOPER_ID_P12_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.APPLE_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.APPLE_NOTARY_KEY_ID }}"
        key: "env:APPLE_NOTARY_KEY_P8_BASE64"
        # wait: true makes the release fail when Apple rejects a binary (the
        # error carries Apple's log) or the wait times out. Without it the
        # release publishes binaries that are not notarized.
        wait: true
        # GoReleaser's maximum: Apple rejects longer-lived API tokens.
        timeout: 20m

archives:
  - id: sabx-archive
    ids: [sabx]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - RELEASE_NOTES.md

# Formula under Formula/, matching bitbucket-cli / jk / amq and avivsinai/homebrew-tap.
# homebrew_casks would publish a Cask under Casks/, which this tap does not use.
brews:
  - name: sabx
    ids: [sabx-archive]
    repository:
      owner: avivsinai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/avivsinai/sabx
    description: Full-fidelity SABnzbd CLI
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "sabx"
    # Re-sign ad-hoc only when the installed binary has no team: an ad-hoc
    # re-sign would replace a Developer ID signature. The check reads the
    # installed binary, so it holds even when release signing was skipped.
    extra_install: |
      if OS.mac?
        signature = Utils.popen_read("/usr/bin/codesign", "-dv", bin/"sabx", err: :out)
        unless signature.match?(/^TeamIdentifier=(?!not set$)\S+$/)
          system "/usr/bin/codesign", "--force", "--sign", "-", "--identifier", "io.github.avivsinai.sabx", bin/"sabx"
        end
      end
    test: |
      system "#{bin}/sabx", "--version"

scoops:
  - name: sabx
    repository:
      owner: avivsinai
      name: scoop-bucket
      branch: main
    homepage: https://github.com/avivsinai/sabx
    description: Full-fidelity SABnzbd CLI
    license: MIT
    skip_upload: true
    commit_author:
      name: sabx automation
      email: releases@sabx.dev

winget:
  - name: sabx
    publisher: sabx
    package_identifier: sabx.sabx
    homepage: https://github.com/sabx/sabx
    short_description: Full-fidelity SABnzbd CLI
    license: MIT
    commit_author:
      name: sabx automation
      email: releases@sabx.dev

dockers_v2:
  - id: sabx
    ids: [sabx]
    images:
      - ghcr.io/avivsinai/sabx
    tags:
      - "{{ .Tag }}"
      - latest
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: "🚀 Features"
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: "📦 Dependencies"
      regexp: '^deps(\(.+\))?:'
      order: 2
    - title: "🔧 Other Changes"
      order: 999

release:
  github:
    owner: avivsinai
    name: sabx
  draft: false
  prerelease: false
  mode: replace
  header: |
    ## sabx {{ .Tag }} ({{ .Date }})

    This release delivers the latest SABnzbd CLI parity updates and fixes.
  footer: |
    ---

    **Full changelog**: https://github.com/sabx/sabx/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### Homebrew (macOS/Linux)
    ```bash
    brew install avivsinai/tap/sabx
    ```

    ### Go Install
    ```bash
    go install github.com/avivsinai/sabx/cmd/sabx@{{ .Tag }}
    ```

    ### Docker
    ```bash
    docker pull ghcr.io/avivsinai/sabx:{{ .Tag }}
    ```
