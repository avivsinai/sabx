version: 2

before:
  hooks:
    - go mod tidy

project_name: sabx

builds:
  - id: sabx
    main: ./cmd/sabx
    binary: sabx
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/avivsinai/sabx/internal/buildinfo.Version={{ .Version }}
      - -X github.com/avivsinai/sabx/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/avivsinai/sabx/internal/buildinfo.Date={{ .Date }}
    flags:
      - -trimpath
    hooks:
      post:
        - sh -ceu 'if [ "$2" = darwin ] && [ "$(uname -s)" = Darwin ]; then codesign --force --sign - --identifier io.github.avivsinai.sabx "$1"; fi' _ "{{ .Path }}" "{{ .Os }}"

archives:
  - id: sabx-archive
    ids: [sabx]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - RELEASE_NOTES.md

# Formula under Formula/, matching bitbucket-cli / jk / amq and avivsinai/homebrew-tap.
# homebrew_casks would publish a Cask under Casks/, which this tap does not use.
brews:
  - name: sabx
    ids: [sabx-archive]
    repository:
      owner: avivsinai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/avivsinai/sabx
    description: Full-fidelity SABnzbd CLI
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "sabx"
    extra_install: |
      if OS.mac?
        system "/usr/bin/codesign", "--force", "--sign", "-", "--identifier", "io.github.avivsinai.sabx", bin/"sabx"
      end
    test: |
      system "#{bin}/sabx", "--version"

scoops:
  - name: sabx
    repository:
      owner: avivsinai
      name: scoop-bucket
      branch: main
    homepage: https://github.com/avivsinai/sabx
    description: Full-fidelity SABnzbd CLI
    license: MIT
    skip_upload: true
    commit_author:
      name: sabx automation
      email: releases@sabx.dev

winget:
  - name: sabx
    publisher: sabx
    package_identifier: sabx.sabx
    homepage: https://github.com/sabx/sabx
    short_description: Full-fidelity SABnzbd CLI
    license: MIT
    commit_author:
      name: sabx automation
      email: releases@sabx.dev

dockers_v2:
  - id: sabx
    ids: [sabx]
    images:
      - ghcr.io/avivsinai/sabx
    tags:
      - "{{ .Tag }}"
      - latest
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: "🚀 Features"
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: "📦 Dependencies"
      regexp: '^deps(\(.+\))?:'
      order: 2
    - title: "🔧 Other Changes"
      order: 999

release:
  github:
    owner: avivsinai
    name: sabx
  draft: false
  prerelease: false
  mode: replace
  header: |
    ## sabx {{ .Tag }} ({{ .Date }})

    This release delivers the latest SABnzbd CLI parity updates and fixes.
  footer: |
    ---

    **Full changelog**: https://github.com/sabx/sabx/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### Homebrew (macOS/Linux)
    ```bash
    brew install avivsinai/tap/sabx
    ```

    ### Go Install
    ```bash
    go install github.com/avivsinai/sabx/cmd/sabx@{{ .Tag }}
    ```

    ### Docker
    ```bash
    docker pull ghcr.io/avivsinai/sabx:{{ .Tag }}
    ```
