version: 2

before:
  hooks:
    - go mod tidy

project_name: sabx

builds:
  - id: sabx
    main: ./cmd/sabx
    binary: sabx
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/avivsinai/sabx/internal/buildinfo.Version={{ .Version }}
      - -X github.com/avivsinai/sabx/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/avivsinai/sabx/internal/buildinfo.Date={{ .Date }}
    # The macOS Keychain backend of github.com/99designs/keyring needs cgo, so
    # darwin builds use cgo and run on a macOS host (release.yml). Linux and
    # Windows stay static cross builds.
    env:
      - CGO_ENABLED={{- if eq .Os "darwin" }}1{{- else }}0{{- end }}
      # Darwin links through clang (cgo), which defaults the minimum macOS to
      # the build host (macOS 26 on macos-latest), so older Macs refuse to run
      # the binary. Pin it to the Go toolchain floor. The flags carry the pin
      # too, because MACOSX_DEPLOYMENT_TARGET alone is not in the build-cache
      # key; CGO_CFLAGS keeps Go's default -O2 -g. Ignored when cgo is off.
      - MACOSX_DEPLOYMENT_TARGET=13.0
      - CGO_CFLAGS=-O2 -g -mmacosx-version-min=13.0
      - CGO_LDFLAGS=-mmacosx-version-min=13.0
    flags:
      - -trimpath
    hooks:
      post:
        # Release builds: Developer ID signature and notarization. Other
        # builds: ad-hoc signature. Keep the identifier and the team: a change
        # makes every user approve Keychain access again.
        - cmd: ./scripts/codesign-macos.sh "{{ .Path }}" "io.github.avivsinai.sabx" "{{ .Os }}"

archives:
  - id: sabx-archive
    ids: [sabx]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - RELEASE_NOTES.md

# Formula under Formula/, matching bitbucket-cli / jk / amq and avivsinai/homebrew-tap.
# homebrew_casks would publish a Cask under Casks/, which this tap does not use.
brews:
  - name: sabx
    ids: [sabx-archive]
    repository:
      owner: avivsinai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/avivsinai/sabx
    description: Full-fidelity SABnzbd CLI
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "sabx"
    # Re-sign ad-hoc only when the installed binary has no team: an ad-hoc
    # re-sign would replace a Developer ID signature. The check reads the
    # installed binary, so it holds even when release signing was skipped. The
    # re-sign keeps the identifier and pinned DR of scripts/codesign-macos.sh.
    extra_install: |
      if OS.mac?
        signature = Utils.popen_read("/usr/bin/codesign", "-dv", bin/"sabx", err: :out)
        unless signature.match?(/^TeamIdentifier=(?!not set$)\S+$/)
          system "/usr/bin/codesign", "--force", "--sign", "-", "--identifier", "io.github.avivsinai.sabx",
                 "-r=designated => identifier \"io.github.avivsinai.sabx\"", bin/"sabx"
        end
      end
    test: |
      system "#{bin}/sabx", "--version"

scoops:
  - name: sabx
    repository:
      owner: avivsinai
      name: scoop-bucket
      branch: main
    homepage: https://github.com/avivsinai/sabx
    description: Full-fidelity SABnzbd CLI
    license: MIT
    skip_upload: true
    commit_author:
      name: sabx automation
      email: releases@sabx.dev

winget:
  - name: sabx
    publisher: sabx
    package_identifier: sabx.sabx
    homepage: https://github.com/sabx/sabx
    short_description: Full-fidelity SABnzbd CLI
    license: MIT
    commit_author:
      name: sabx automation
      email: releases@sabx.dev

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: "🚀 Features"
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: "📦 Dependencies"
      regexp: '^deps(\(.+\))?:'
      order: 2
    - title: "🔧 Other Changes"
      order: 999

release:
  github:
    owner: avivsinai
    name: sabx
  draft: false
  prerelease: false
  mode: replace
  header: |
    ## sabx {{ .Tag }} ({{ .Date }})

    This release delivers the latest SABnzbd CLI parity updates and fixes.
  footer: |
    ---

    **Full changelog**: https://github.com/sabx/sabx/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### Homebrew (macOS/Linux)
    ```bash
    brew install avivsinai/tap/sabx
    ```

    ### Go Install
    ```bash
    go install github.com/avivsinai/sabx/cmd/sabx@{{ .Tag }}
    ```

    ### Docker
    ```bash
    docker pull ghcr.io/avivsinai/sabx:{{ .Tag }}
    ```
