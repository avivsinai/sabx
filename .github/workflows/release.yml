name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release (e.g., v1.2.3)'
        required: true
        type: string
      skip-skill-publish:
        description: 'Skip skill publishing (GoReleaser always runs on dispatch)'
        required: false
        type: boolean
        default: true

# Keep workflow_dispatch reruns serialized per tag while letting distinct release commits run independently.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      release_ref: ${{ steps.prepare.outputs.release_ref }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve release metadata
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail

          validate_tag() {
            local tag="$1"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
              echo "::error::Release identifiers must use vX.Y.Z style tags."
              exit 1
            fi
          }

          tag_commit_sha() {
            git rev-parse "refs/tags/${1}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${1}"
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              tag="$INPUT_TAG"
              validate_tag "$tag"
              git fetch --force --tags origin
              if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                echo "::error::Tag ${tag} does not exist. workflow_dispatch is only for rerunning an existing release."
                exit 1
              fi
              git checkout --detach "$tag"
              version="${tag#v}"
              ./scripts/check-release-version.sh "$version"
              release_ref="$tag"
              release_sha="$(tag_commit_sha "$tag")"
              ;;
            push)
              commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
              tag="${commit_subject#chore(release): }"
              tag="${tag%% \(#*}"
              validate_tag "$tag"

              version="${tag#v}"
              ./scripts/check-release-version.sh "$version"

              release_sha="${GITHUB_SHA}"
              if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                existing_sha="$(tag_commit_sha "$tag")"
                if [[ "$existing_sha" != "$release_sha" ]]; then
                  echo "::error::Tag ${tag} already exists but points to ${existing_sha}, not ${release_sha}."
                  exit 1
                fi
              fi
              release_ref="${release_sha}"
              ;;
            *)
              echo "::error::Unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "release_ref=${release_ref}"
            echo "release_sha=${release_sha}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Release Commit
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Verify Docker
        run: docker version

      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Unit tests (skip smoke)
        run: SABX_E2E_DISABLE=1 make test

      - name: Smoke tests
        run: make smoke

      - name: Build CLI
        run: VERSION=${{ needs.prepare.outputs.tag }} make build

      - name: Check embedded version
        run: ./bin/sabx version | grep -Eq "^sabx ${{ needs.prepare.outputs.tag }}( |$)"

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, verify]
    if: needs.prepare.result == 'success' && needs.verify.result == 'success'
    # Notarization waits up to 20 minutes for each of the two darwin binaries.
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release tag after verification
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail

          tag_commit_sha() {
            git rev-parse "refs/tags/${1}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${1}"
          }

          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(tag_commit_sha "$TAG")"
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Tag ${TAG} already exists but points to ${existing_sha}, not ${RELEASE_SHA}."
              exit 1
            fi
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Extract release notes for this tag
        shell: bash
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/RELEASE_NOTES.md
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          python3 - "$VERSION" "$RELEASE_NOTES_PATH" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          output_path = pathlib.Path(sys.argv[2])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"(?ms)^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n.*?(?=^## \[|\Z)"
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"missing changelog section for {version}")
          output_path.write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      # A Developer ID signature gives the binary a stable Keychain partition
      # ID (teamid:), so one "Always Allow" survives upgrades. Ad-hoc builds
      # get a new cdhash: partition per release and prompt again. GoReleaser
      # signs and notarizes with quill (notarize.macos in tools/goreleaser.yaml)
      # when this step sets enabled=true.
      - name: Check macOS signing secrets
        id: macos_signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          names=(APPLE_TEAM_ID APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_KEY_ID APPLE_NOTARY_KEY_P8_BASE64)
          present=0
          for name in "${names[@]}"; do
            [[ -n "${!name:-}" ]] && present=$((present + 1))
          done
          if (( present == 0 )); then
            echo "::warning::macOS binaries are signed ad-hoc: the APPLE_* signing secrets are not configured, so users get a Keychain prompt after each upgrade."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if (( present != ${#names[@]} )); then
            echo "::error::Set all APPLE_* signing secrets or none (see docs/RELEASING.md)."
            exit 1
          fi

          # quill decodes these values with a strict base64 decoder.
          for name in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_NOTARY_KEY_P8_BASE64; do
            if [[ "${!name:-}" =~ [[:space:]] ]]; then
              echo "::error::${name} must be base64 without line breaks."
              exit 1
            fi
          done

          # quill writes the team of the certificate into the signature. Check that
          # team before the release builds anything. Keychain Access exports .p12 files
          # with ciphers that OpenSSL 3 reads only with -legacy.
          read_certs() {
            printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode \
              | openssl pkcs12 -nokeys -clcerts -passin env:APPLE_DEVELOPER_ID_P12_PASSWORD "$@"
          }
          certs="$(read_certs 2>/dev/null || read_certs -legacy)"
          if ! awk -v team="($APPLE_TEAM_ID)" '/^subject=.*Developer ID Application: / && index($0, team) { found = 1 } END { exit !found }' <<<"$certs"; then
            echo "::error::APPLE_DEVELOPER_ID_P12_BASE64 has no 'Developer ID Application' certificate for APPLE_TEAM_ID."
            exit 1
          fi
          echo "enabled=true" >>"$GITHUB_OUTPUT"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --config tools/goreleaser.yaml --clean --release-notes ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SABX_MACOS_SIGN: ${{ steps.macos_signing.outputs.enabled }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}

      - name: Upload dist artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7

  skill-publish:
    name: Publish Skills
    needs: [prepare, publish]
    if: needs.publish.result == 'success' && (github.event_name == 'push' || inputs.skip-skill-publish != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install skild
        run: npm install -g skild

      - name: Configure skild auth
        run: |
          mkdir -p ~/.skild
          echo '${{ secrets.SKILD_AUTH_JSON }}' > ~/.skild/registry-auth.json

      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Publish skills
        run: |
          TAG_VERSION="${{ needs.prepare.outputs.version }}"

          echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || {
            echo "ERROR: version '$TAG_VERSION' is not semver"
            exit 1
          }

          FAILED=0

          for dir in skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            SKILL=$(basename "$dir")
            VERSION="${TAG_VERSION}"

            SKILL_VERSION=$(grep -oP 'version:\s*\K[0-9A-Za-z.+-]+' "$dir/SKILL.md" || true)
            if [ -n "$SKILL_VERSION" ] && [ "$SKILL_VERSION" != "$VERSION" ]; then
              echo "ERROR: $SKILL SKILL.md version ($SKILL_VERSION) != tag version ($VERSION)"
              echo "  Prepare the release with scripts/release.sh $VERSION first"
              FAILED=1
              continue
            fi

            echo "Publishing $SKILL version $VERSION"

            ALIAS_ARGS=()
            if [ ${#SKILL} -ge 3 ] && [ ${#SKILL} -le 64 ]; then
              ALIAS_ARGS=(--alias "$SKILL")
            else
              echo "Warning: Skipping alias for $SKILL: length ${#SKILL} outside 3..64"
            fi

            if OUTPUT=$(npx skild publish \
              --dir "$dir" \
              "${ALIAS_ARGS[@]}" \
              --skill-version "$VERSION" 2>&1); then
              echo "$OUTPUT"
              echo "Published $SKILL version $VERSION"
            elif echo "$OUTPUT" | grep -q "Version already exists"; then
              echo "$OUTPUT"
              echo "Warning: $SKILL version $VERSION already published -- skipping"
            elif echo "$OUTPUT" | grep -q "Alias already in use"; then
              echo "$OUTPUT"
              echo "Warning: Alias '$SKILL' taken -- retrying without alias..."
              if OUTPUT2=$(npx skild publish \
                --dir "$dir" \
                --skill-version "$VERSION" 2>&1); then
                echo "$OUTPUT2"
                echo "Published $SKILL version $VERSION (without alias)"
              elif echo "$OUTPUT2" | grep -q "Version already exists"; then
                echo "$OUTPUT2"
                echo "Warning: $SKILL version $VERSION already published on retry -- skipping"
              else
                echo "Publish failed for $SKILL (even without alias)"
                echo "$OUTPUT2"
                FAILED=1
              fi
            else
              echo "Publish failed for $SKILL"
              echo "$OUTPUT"
              FAILED=1
            fi
          done

          exit $FAILED
