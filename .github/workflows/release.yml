name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release (e.g., v1.2.3)'
        required: true
        type: string
      skip-skill-publish:
        description: 'Skip skill publishing (GoReleaser always runs on dispatch)'
        required: false
        type: boolean
        default: true

# Keep workflow_dispatch reruns serialized per tag while letting distinct release commits run independently.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      release_ref: ${{ steps.prepare.outputs.release_ref }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve release metadata
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail

          validate_tag() {
            local tag="$1"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
              echo "::error::Release identifiers must use vX.Y.Z style tags."
              exit 1
            fi
          }

          tag_commit_sha() {
            git rev-parse "refs/tags/${1}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${1}"
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              tag="$INPUT_TAG"
              validate_tag "$tag"
              git fetch --force --tags origin
              if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                echo "::error::Tag ${tag} does not exist. workflow_dispatch is only for rerunning an existing release."
                exit 1
              fi
              git checkout --detach "$tag"
              version="${tag#v}"
              ./scripts/check-release-version.sh "$version"
              release_ref="$tag"
              release_sha="$(tag_commit_sha "$tag")"
              ;;
            push)
              commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
              tag="${commit_subject#chore(release): }"
              tag="${tag%% \(#*}"
              validate_tag "$tag"

              version="${tag#v}"
              ./scripts/check-release-version.sh "$version"

              release_sha="${GITHUB_SHA}"
              if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                existing_sha="$(tag_commit_sha "$tag")"
                if [[ "$existing_sha" != "$release_sha" ]]; then
                  echo "::error::Tag ${tag} already exists but points to ${existing_sha}, not ${release_sha}."
                  exit 1
                fi
              fi
              release_ref="${release_sha}"
              ;;
            *)
              echo "::error::Unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "release_ref=${release_ref}"
            echo "release_sha=${release_sha}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Release Commit
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Verify Docker
        run: docker version

      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Unit tests (skip smoke)
        run: SABX_E2E_DISABLE=1 make test

      - name: Smoke tests
        run: make smoke

      - name: Build CLI
        run: VERSION=${{ needs.prepare.outputs.tag }} make build

      - name: Check embedded version
        run: ./bin/sabx version | grep -Eq "^sabx ${{ needs.prepare.outputs.tag }}( |$)"

  # GoReleaser runs on macOS: the darwin binaries need cgo for the Keychain
  # backend of github.com/99designs/keyring, and codesign/notarytool exist only
  # on macOS. Linux and Windows binaries are static cross builds. GoReleaser OSS
  # cannot split one release across runners, so the GHCR image is built in the
  # docker job below (macOS runners have no Docker).
  publish:
    name: Publish Release
    runs-on: macos-latest
    needs: [prepare, verify]
    if: needs.prepare.result == 'success' && needs.verify.result == 'success'
    # Notarization waits up to 20 minutes for each of the two darwin binaries.
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Create release tag after verification
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail

          tag_commit_sha() {
            git rev-parse "refs/tags/${1}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${1}"
          }

          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(tag_commit_sha "$TAG")"
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Tag ${TAG} already exists but points to ${existing_sha}, not ${RELEASE_SHA}."
              exit 1
            fi
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Extract release notes for this tag
        shell: bash
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/RELEASE_NOTES.md
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          python3 - "$VERSION" "$RELEASE_NOTES_PATH" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          output_path = pathlib.Path(sys.argv[2])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"(?ms)^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n.*?(?=^## \[|\Z)"
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"missing changelog section for {version}")
          output_path.write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      # A Developer ID signature gives the binary a stable Keychain partition
      # ID (teamid:), so one "Always Allow" survives upgrades. Ad-hoc builds
      # get a new cdhash: partition per release and prompt again
      # (see scripts/codesign-macos.sh).
      - name: Configure macOS signing
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          names=(P12_BASE64 P12_PASSWORD TEAM_ID NOTARY_ISSUER_ID NOTARY_KEY_ID NOTARY_KEY_P8_BASE64)
          present=0
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] && present=$((present + 1))
          done
          if (( present == 0 )); then
            echo "::warning::macOS binaries are signed ad-hoc: the APPLE_* signing secrets are not configured, so users get a Keychain prompt after each upgrade."
            exit 0
          fi
          if (( present != ${#names[@]} )); then
            echo "::error::Set all APPLE_* signing secrets or none (see docs/RELEASING.md)."
            exit 1
          fi

          keychain="$RUNNER_TEMP/sabx-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          # Publish the path first so the cleanup step removes the keychain
          # even when a later command here fails.
          echo "SABX_MACOS_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # Put the signing keychain first and keep the existing search list.
          # shellcheck disable=SC2046 # one word per keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # The SHA-1 picks one identity even if the .p12 holds a renewed and
          # an older certificate. -v lists only identities with a trusted
          # chain, so the .p12 must include the Developer ID intermediate.
          identity_sha="$(security find-identity -v -p codesigning "$keychain" \
            | awk -v team="($TEAM_ID)" '/Developer ID Application: / && index($0, team) { print $2; exit }')"
          if [[ -z "$identity_sha" ]]; then
            echo "::error::APPLE_DEVELOPER_ID_P12_BASE64 has no trusted 'Developer ID Application' identity for APPLE_TEAM_ID."
            exit 1
          fi

          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode >"$RUNNER_TEMP/notary-key.p8"
          {
            echo "SABX_MACOS_SIGN_IDENTITY=$identity_sha"
            echo "SABX_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
          } >>"$GITHUB_ENV"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --config tools/goreleaser.yaml --clean --release-notes ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # scripts/codesign-macos.sh signs with the Developer ID when
          # SABX_MACOS_TEAM_ID is set; the step above exports the rest.
          SABX_MACOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SABX_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          SABX_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${SABX_MACOS_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SABX_MACOS_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Upload dist artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7

  # Builds the GHCR image from the linux binaries of the publish job, so the
  # image and the release archives hold the same bytes.
  docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: needs.publish.result == 'success'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      # Dockerfile.release copies linux/<arch>/sabx. Artifact upload drops
      # the executable bit, so set it again.
      - name: Stage linux binaries
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while read -r arch path; do
            install -D -m 0755 "$path" "docker-context/linux/${arch}/sabx"
            count=$((count + 1))
          done < <(jq -r '.[] | select(.type == "Binary" and .goos == "linux") | "\(.goarch) \(.path)"' dist/artifacts.json)
          if (( count != 2 )); then
            echo "::error::Expected 2 linux binaries in dist/artifacts.json, found ${count}."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --sbom=true \
            --provenance=true \
            --tag "ghcr.io/avivsinai/sabx:${TAG}" \
            --tag ghcr.io/avivsinai/sabx:latest \
            --file Dockerfile.release \
            --push \
            docker-context

  skill-publish:
    name: Publish Skills
    needs: [prepare, publish]
    if: needs.publish.result == 'success' && (github.event_name == 'push' || inputs.skip-skill-publish != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install skild
        run: npm install -g skild

      - name: Configure skild auth
        run: |
          mkdir -p ~/.skild
          echo '${{ secrets.SKILD_AUTH_JSON }}' > ~/.skild/registry-auth.json

      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Publish skills
        run: |
          TAG_VERSION="${{ needs.prepare.outputs.version }}"

          echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || {
            echo "ERROR: version '$TAG_VERSION' is not semver"
            exit 1
          }

          FAILED=0

          for dir in skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            SKILL=$(basename "$dir")
            VERSION="${TAG_VERSION}"

            SKILL_VERSION=$(grep -oP 'version:\s*\K[0-9A-Za-z.+-]+' "$dir/SKILL.md" || true)
            if [ -n "$SKILL_VERSION" ] && [ "$SKILL_VERSION" != "$VERSION" ]; then
              echo "ERROR: $SKILL SKILL.md version ($SKILL_VERSION) != tag version ($VERSION)"
              echo "  Prepare the release with scripts/release.sh $VERSION first"
              FAILED=1
              continue
            fi

            echo "Publishing $SKILL version $VERSION"

            ALIAS_ARGS=()
            if [ ${#SKILL} -ge 3 ] && [ ${#SKILL} -le 64 ]; then
              ALIAS_ARGS=(--alias "$SKILL")
            else
              echo "Warning: Skipping alias for $SKILL: length ${#SKILL} outside 3..64"
            fi

            if OUTPUT=$(npx skild publish \
              --dir "$dir" \
              "${ALIAS_ARGS[@]}" \
              --skill-version "$VERSION" 2>&1); then
              echo "$OUTPUT"
              echo "Published $SKILL version $VERSION"
            elif echo "$OUTPUT" | grep -q "Version already exists"; then
              echo "$OUTPUT"
              echo "Warning: $SKILL version $VERSION already published -- skipping"
            elif echo "$OUTPUT" | grep -q "Alias already in use"; then
              echo "$OUTPUT"
              echo "Warning: Alias '$SKILL' taken -- retrying without alias..."
              if OUTPUT2=$(npx skild publish \
                --dir "$dir" \
                --skill-version "$VERSION" 2>&1); then
                echo "$OUTPUT2"
                echo "Published $SKILL version $VERSION (without alias)"
              elif echo "$OUTPUT2" | grep -q "Version already exists"; then
                echo "$OUTPUT2"
                echo "Warning: $SKILL version $VERSION already published on retry -- skipping"
              else
                echo "Publish failed for $SKILL (even without alias)"
                echo "$OUTPUT2"
                FAILED=1
              fi
            else
              echo "Publish failed for $SKILL"
              echo "$OUTPUT"
              FAILED=1
            fi
          done

          exit $FAILED
